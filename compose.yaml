# Local stack: the API and its PostgreSQL database.
# Credentials and the token secret below are for local development only.
name: devices-api

x-auth-env: &auth-env
  AUTH_ISSUER: ${AUTH_ISSUER:-devices-api-local}
  AUTH_AUDIENCE: ${AUTH_AUDIENCE:-devices-api}
  AUTH_HS256_SECRET: ${AUTH_HS256_SECRET:-local-development-secret-change-me}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: devices
      POSTGRES_PASSWORD: devices
      POSTGRES_DB: devices
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devices -d devices"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      target: api
      args:
        VERSION: ${VERSION:-dev}
    environment:
      <<: *auth-env
      DATABASE_URL: postgres://devices:devices@postgres:5432/devices?sslmode=disable
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Set by `make observability` to push telemetry to the collector.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=local
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Prints a development token: docker compose run --rm tokengen
  tokengen:
    profiles: [tools]
    build:
      context: .
      target: tokengen
    environment:
      <<: *auth-env

  # Observability stack: make observability
  otel-collector:
    profiles: [observability]
    image: otel/opentelemetry-collector-contrib:0.115.1
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./deploy/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    depends_on: [jaeger]

  jaeger:
    profiles: [observability]
    image: jaegertracing/all-in-one:1.64.0
    ports:
      - "${JAEGER_PORT:-16686}:16686"

  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.0.1
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"

volumes:
  pgdata:
